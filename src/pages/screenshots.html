title: Screenshots | NEXGUARD
desc: Screenshots of NEXGUARD {{version}} on Android.
path: /screenshots/
css: store
scene: quiet
---
<div class="w sec"><header class="phero"><p class="crumb"><a href="/">Home</a> / Screenshots</p><h1><span class="grad">Screenshots</span></h1><p class="lead">Version {{version}}, taken on an OPPO CPH1909 running ColorOS 5.2.1. Tap a screenshot to enlarge it.</p></header><div data-ring-host><div class="ring-wrap" data-ring tabindex="0" aria-label="Screenshot carousel"><div class="ring">{{shotsGrid}}</div></div><div class="ring-ctl" data-ring-ctl><button class="ib" data-r="prev" aria-label="Previous screenshot">{{icon:chevron-left}}</button><p class="ring-cap" aria-live="polite" style="margin:0"></p><button class="ib" data-r="next" aria-label="Next screenshot">{{icon:chevron-right}}</button></div></div>
<div class="gal">{{shotsGrid}}</div></div>
