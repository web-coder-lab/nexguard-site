<section class="scr" id="s-home" aria-label="Home screen"><div class="h-top"><div class="l"><span class="a-ic">{{icon:shield}}</span><div><b>NEXGUARD</b><small>Notification Health Monitor</small></div></div><button class="a-gear" data-act="open-settings" aria-label="Settings">{{icon:gear}}</button></div>
<div class="h-body"><button class="shield" id="shield" data-st="active" data-act="shield" aria-label="Monitoring status"><svg viewBox="0 0 100 100" style="--c:var(--good)" aria-hidden="true"><path class="f" d="M50 8C80 8 92 16 90 42C88 68 68 86 50 94C32 86 12 68 10 42C8 16 20 8 50 8Z"/><path class="o" d="M50 8C80 8 92 16 90 42C88 68 68 86 50 94C32 86 12 68 10 42C8 16 20 8 50 8Z"/><circle cx="78" cy="22" r="5.5" style="fill:var(--c)"/><circle cx="78" cy="22" r="2.2" fill="#fff"/></svg></button>
<div class="h-t" id="h-t">Monitoring Active</div><p class="a-sub" id="h-d">Monitoring notification delivery in background</p>
<button class="a-btn" data-act="start">{{icon:shield}} Start Monitoring</button><button class="a-btn out sm" data-act="stop"><i class="sq"></i> Stop Monitoring</button>
<div class="a-card h-card"><div class="r"><span>{{icon:bell}}Notification Access</span><i class="a-badge good" id="b-acc">Active</i></div><div class="r"><span>{{icon:check}}Monitoring State</span><i class="a-badge good" id="b-mon">Monitoring active</i></div><div class="r"><span>{{icon:battery}}Battery Policy</span><i class="a-badge good" id="b-bat">Unrestricted</i></div></div>
<button class="a-btn out" data-act="diag">{{icon:search}} Run Diagnostics</button></div></section>
