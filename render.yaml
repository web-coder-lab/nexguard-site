services:
  - type: web
    name: nexguard-site
    runtime: static
    buildCommand: node build.mjs
    staticPublishPath: dist
    envVars:
      - key: SITE_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
